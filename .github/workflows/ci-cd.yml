name: CloudPulse CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: Run Automated Tests & Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: pip install -r requirements.txt
        working-directory: backend

      - name: Run Backend Pytest Suite
        run: pytest -v --tb=short
        working-directory: backend

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies & Build
        run: |
          npm install
          npm run build
        working-directory: frontend

  build-scan-push:
    name: Build Containers, Trivy Scan & Push to GHCR
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Backend Docker Image
        run: |
          docker build \
            --tag ghcr.io/${{ github.repository_owner }}/cloudpulse-backend:${{ github.sha }} \
            ./backend

      - name: Build Frontend Docker Image
        run: |
          docker build \
            --tag ghcr.io/${{ github.repository_owner }}/cloudpulse-frontend:${{ github.sha }} \
            ./frontend

      - name: Trivy Vulnerability Scan (Backend Image)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/cloudpulse-backend:${{ github.sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'

      - name: Trivy Vulnerability Scan (Frontend Image)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/cloudpulse-frontend:${{ github.sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'

      - name: Push Container Images to GHCR
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/cloudpulse-backend:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/cloudpulse-frontend:${{ github.sha }}

  deploy:
    name: Deploy to Kubernetes via Helm
    if: github.ref == 'refs/heads/main'
    needs: build-scan-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Configure Kubectl with Cluster Credentials
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          if [ -n "$KUBE_CONFIG_DATA" ]; then
            mkdir -p ~/.kube
            echo "$KUBE_CONFIG_DATA" | base64 -d > ~/.kube/config
          else
            echo "KUBE_CONFIG_DATA secret not configured yet. Skipping cluster connect."
          fi

      - name: Helm Upgrade / Install
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          if [ -n "$KUBE_CONFIG_DATA" ]; then
            helm upgrade --install cloudpulse ./helm/cloudpulse \
              --namespace cloudpulse \
              --create-namespace \
              --set backend.tag=${{ github.sha }} \
              --set frontend.tag=${{ github.sha }} \
              --set backend.image=ghcr.io/${{ github.repository_owner }}/cloudpulse-backend \
              --set frontend.image=ghcr.io/${{ github.repository_owner }}/cloudpulse-frontend
          else
            echo "Simulating Helm template verification..."
            helm template cloudpulse ./helm/cloudpulse \
              --set backend.tag=${{ github.sha }} \
              --set frontend.tag=${{ github.sha }} \
              --set backend.image=ghcr.io/${{ github.repository_owner }}/cloudpulse-backend \
              --set frontend.image=ghcr.io/${{ github.repository_owner }}/cloudpulse-frontend
          fi
