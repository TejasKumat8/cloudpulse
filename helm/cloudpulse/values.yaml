# Default values for cloudpulse.
replicaCount: 2
namespace: cloudpulse

frontend:
  image: ghcr.io/TejasKumat8/cloudpulse-frontend
  tag: latest
  port: 8080
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

backend:
  image: ghcr.io/TejasKumat8/cloudpulse-backend
  tag: latest
  port: 8000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

postgres:
  host: cloudpulse-postgres
  port: 5432
  database: cloudpulse
  username: cloudpulse
  password: cloudpulse_secure_password
  storage: 5Gi

ingress:
  enabled: true
  className: nginx
  host: cloudpulse.local
  annotations:
    kubernetes.io/ingress.class: nginx

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 60

monitoring:
  serviceMonitor:
    enabled: true
    interval: 15s

imagePullSecrets: []
