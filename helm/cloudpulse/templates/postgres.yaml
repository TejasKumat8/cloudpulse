apiVersion: v1
kind: Secret
metadata:
  name: cloudpulse-postgres
  labels:
    app: cloudpulse-postgres
type: Opaque
stringData:
  username: {{ .Values.postgres.username | quote }}
  password: {{ .Values.postgres.password | quote }}
  database: {{ .Values.postgres.database | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.postgres.host }}
  labels:
    app: cloudpulse-postgres
spec:
  type: ClusterIP
  selector:
    app: cloudpulse-postgres
  ports:
    - port: {{ .Values.postgres.port }}
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudpulse-postgres
  labels:
    app: cloudpulse-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudpulse-postgres
  template:
    metadata:
      labels:
        app: cloudpulse-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: cloudpulse-postgres
                  key: database
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: cloudpulse-postgres
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cloudpulse-postgres
                  key: password
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U $POSTGRES_USER -d $POSTGRES_DB
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: cloudpulse-postgres-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cloudpulse-postgres-data
  labels:
    app: cloudpulse-postgres
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.postgres.storage }}
